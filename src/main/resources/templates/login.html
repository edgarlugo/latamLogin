<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Iniciar sesión</title>
	<link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
</head>
<body class="bg-body-tertiary">
	<main class="container py-5">
		<div class="row justify-content-center">
			<div class="col-sm-10 col-md-6 col-lg-4">
				<h1 class="h3 mb-4 text-center">Iniciar sesión</h1>

				<div th:if="${result}" class="alert" role="alert"
					th:classappend="${result.respondida} ? 'alert-info' : 'alert-danger'">
					<strong th:if="${result.codigo}" th:text="${result.codigo} + ':'">200:</strong>
					<span th:text="${result.mensaje}">Mensaje de la API</span>
				</div>

				<form th:action="@{/login}" th:object="${loginForm}" method="post" novalidate>
					<div class="mb-3">
						<label for="login" class="form-label">Usuario</label>
						<input type="text" th:field="*{login}" class="form-control"
							th:errorclass="is-invalid" autocomplete="username" autofocus required>
						<div class="invalid-feedback" th:errors="*{login}">Error</div>
					</div>
					<div class="mb-3">
						<label for="password" class="form-label">Contraseña</label>
						<input type="password" th:field="*{password}" class="form-control"
							th:errorclass="is-invalid" autocomplete="current-password" required>
						<div class="invalid-feedback" th:errors="*{password}">Error</div>
					</div>
					<button type="submit" class="btn btn-primary w-100">Ingresar</button>
				</form>
			</div>
		</div>
	</main>
</body>
</html>
